<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0077a5" />
    <title>You're offline</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fdfdf9; color: #17151f; text-align: center; }
      main { max-width: 360px; }
      img { height: 40px; width: auto; margin-bottom: 24px; }
      h1 { margin: 0 0 8px; font-size: 24px; font-weight: 800; }
      p { margin: 0 0 24px; color: #5a5864; line-height: 1.5; }
      button { font: inherit; font-weight: 700; padding: 12px 24px; border: 0; border-radius: 12px; background: #0077a5; color: #fff; cursor: pointer; }
      button:focus-visible { outline: 3px solid #0077a5; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/logo-horizontal.png" alt="Darl Creates" />
      <h1>You're offline</h1>
      <p>We can't reach the shop right now. Check your connection, then try again. Your cart is saved on your account.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
